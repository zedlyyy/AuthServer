<!DOCTYPE html>
<html lang="en">


<head>

    <script src="index.js" defer></script>


    <meta charset="UTF-8">
    <title>OAuth Callback</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d0d0d;
            color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #1a1a1a;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 2px 0px rgba(255, 255, 255, 0.05);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #ffffff;
        }

        p {
            margin: 10px 0;
        }

        button {
            font-size: 1rem;
            padding: 12px 24px;
            background-color: #00c896;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 20px;
        }

        button:hover {
            background-color: #00a77b;
        }

        button:active {
            background-color: #007a5a;
        }

        pre {
            background-color: #262626;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: left;
            overflow-x: auto;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>OAuth Callback</h1>
    <div id="info"></div>
    <button onclick="getToken()">Get Token</button>
    <button onclick="exitToLogin()">Exit</button>
    <pre id="tokenDisplay">No token yet</pre>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');
    const state = urlParams.get('state');

    document.getElementById('info').innerHTML = `<p>Code: ${code}</p><p>State: ${state}</p>`;

</script>
</body>
</html>
